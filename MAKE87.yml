version: 1
interfaces:
  - name: zenoh-client
    protocol: zenoh
    default_port:
      name: zenoh-client
      protocol: TCP
      target_port: 7447
    providers:
      - name: SET_DRIVE_DIRECTION
        request_spec:
          make87_message: make87_messages.tensor.vector.Vector3
        response_spec:
          make87_message: make87_messages.core.Empty
        encoding: proto
      - name: SET_CAMERA_DIRECTION
        request_spec:
          make87_message: make87_messages.tensor.vector.Vector2
        response_spec:
          make87_message: make87_messages.core.Empty
        encoding: proto
      - name: GET_CAMERA_IMAGE
        request_spec:
          make87_message: make87_messages.core.Empty
        response_spec:
          make87_message: make87_messages.image.compressed.image_jpeg.ImageJPEG
        encoding: proto
    publishers:
      - name: IMAGE
        spec:
          make87_message: make87_messages.image.compressed.image_jpeg.ImageJPEG
        encoding: proto
  - name: mcp-server
    protocol: mcp
    default_port:
      name: mcp-server
      protocol: TCP
      target_port: 9988
    servers:
      - name: mcp-sse-server
        spec:
          string: mcp/http
container_config: {}
config: {}
peripheral_requirements:
  - name: CAMERA
    peripheral_type: Camera
  - name: ISP
    peripheral_type: ISP
  - name: I2C
    peripheral_type: I2C
build:
  custom:
    dockerfile: build_kit/Dockerfile
    platforms:
      - linux/arm64
